name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # GitHub's contribution API occasionally times out (returns the "Unicorn!" 5xx page),
      # so try up to 3 times before failing.
      - id: snk1
        uses: Platane/snk@v3
        continue-on-error: true
        with: &snk
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5CC8C8&color_dots=#ebedf0,#b2e8e8,#5CC8C8,#2a9a9a,#0E2A47
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5CC8C8

      - if: steps.snk1.outcome == 'failure'
        run: sleep 30

      - id: snk2
        if: steps.snk1.outcome == 'failure'
        uses: Platane/snk@v3
        continue-on-error: true
        with: *snk

      - if: steps.snk2.outcome == 'failure'
        run: sleep 60

      - if: steps.snk2.outcome == 'failure'
        uses: Platane/snk@v3
        with: *snk

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
